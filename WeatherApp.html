<!DOCTYPE html>

<html lang="en">

<head>
<charset="UTF-8">

<title>Advanced Weather App</title>

<style>

  body {
    font-family: Arial;
    text-align: center;
    margin-top: 80px;
    transition: background 0.5s;
    color: white;
  }

  .container {
    background: rgba(0,0,0,0.5);
    padding: 20px;
    border-radius: 12px;
    width: 320px;
    margin: auto;
  }

  input {
    padding: 10px;
    width: 70%;
    margin: 10px 0;
    border-radius: 5px;
    border: none;
  }

  button {
    padding: 10px;
    background: orange;
    color: white;
    border: none;
    cursor: pointer;
    border-radius: 5px;
  }

  button:hover {
    background: darkorange;
  }

  #loading {
    display: none;
    font-size: 18px;
  }

  img {
    width: 80px;
  }
</style>

</head>
<body>

<div class="container">
  <h2>Weather App 🌤️</h2>
  
  <input type="text" id="city" placeholder="Enter city name">
  <br>
  <button onclick="getWeather()">Search</button>

  <p id="loading">Loading...</p>

  <div id="weatherResult">
    <h3 id="cityName"></h3>
    <img id="icon" src="">
    <p id="temp"></p>
    <p id="humidity"></p>
    <p id="desc"></p>
  </div>
</div>

<script>
const apiKey = "YOUR_API_KEY";

document.getElementById("city").addEventListener("keypress", function(e) {
  if (e.key === "Enter") {
    getWeather();
  }
});

async function getWeather() {
  const city = document.getElementById("city").value;
  const loading = document.getElementById("loading");

  if (city === "") {
    alert("Enter city name");
    return;
  }

  loading.style.display = "block";

  const url = `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${apiKey}&units=metric`;

  try {
    const response = await fetch(url);
    const data = await response.json();

    loading.style.display = "none";

    if (data.cod === "404") {
      alert("City not found");
      return;
    }

    document.getElementById("cityName").innerText = data.name;
    document.getElementById("temp").innerText = "🌡️ " + data.main.temp + "°C";
    document.getElementById("humidity").innerText = "💧 Humidity: " + data.main.humidity + "%";
    document.getElementById("desc").innerText = "🌥️ " + data.weather[0].description;

    // Weather Icon
    const iconCode = data.weather[0].icon;
    document.getElementById("icon").src =
      `https://openweathermap.org/img/wn/${iconCode}@2x.png`;

    // Background Change
    const weather = data.weather[0].main.toLowerCase();

    if (weather.includes("cloud")) {
      document.body.style.background = "linear-gradient(to right, #bdc3c7, #2c3e50)";
    } else if (weather.includes("rain")) {
      document.body.style.background = "linear-gradient(to right, #4b79a1, #283e51)";
    } else if (weather.includes("clear")) {
      document.body.style.background = "linear-gradient(to right, #f7971e, #ffd200)";
    } else if (weather.includes("snow")) {
      document.body.style.background = "linear-gradient(to right, #e6dada, #274046)";
    } else {
      document.body.style.background = "linear-gradient(to right, #74ebd5, #ACB6E5)";
    }

  } catch (error) {
    loading.style.display = "none";
    alert("Error fetching data");
  }
}
</script>

</body>
</html>
