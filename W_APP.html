<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Modern Weather App</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=80&w=1400&auto=format&fit=crop') no-repeat center center/cover;
    overflow-x:hidden;
    transition:1s ease;
    padding:20px;
}

/* Overlay */

body::before{
    content:'';
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.35);
    backdrop-filter:blur(4px);
}

/* Main Card */

.container{
    position:relative;
    width:100%;
    max-width:420px;
    background:rgba(255,255,255,0.15);
    border:1px solid rgba(255,255,255,0.2);
    backdrop-filter:blur(18px);
    border-radius:25px;
    padding:30px;
    color:white;
    box-shadow:0 10px 30px rgba(0,0,0,0.35);
    animation:fadeIn 1s ease;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(30px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

h2{
    font-size:32px;
    margin-bottom:20px;
    font-weight:700;
}

/* Search Box */

.search-box{
    display:flex;
    gap:10px;
    margin-bottom:20px;
}

input{
    flex:1;
    padding:14px;
    border:none;
    outline:none;
    border-radius:12px;
    font-size:16px;
    background:rgba(255,255,255,0.2);
    color:white;
}

input::placeholder{
    color:#eee;
}

button{
    border:none;
    padding:14px 18px;
    border-radius:12px;
    background:linear-gradient(45deg,#ff9800,#ff5722);
    color:white;
    cursor:pointer;
    font-size:16px;
    transition:0.3s;
    font-weight:600;
}

button:hover{
    transform:scale(1.05);
}

/* Loading */

#loading{
    display:none;
    margin-top:10px;
    animation:pulse 1s infinite;
}

@keyframes pulse{
    0%{opacity:0.4;}
    50%{opacity:1;}
    100%{opacity:0.4;}
}

/* Weather Result */

.weather-box{
    display:none;
    animation:slide 0.6s ease;
}

@keyframes slide{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.weather-image{
    width:120px;
    animation:float 3s ease-in-out infinite;
}

@keyframes float{
    0%{transform:translateY(0px);}
    50%{transform:translateY(-10px);}
    100%{transform:translateY(0px);}
}

.temp{
    font-size:55px;
    font-weight:700;
}

.desc{
    font-size:20px;
    text-transform:capitalize;
    margin-bottom:15px;
}

.details{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
    margin-top:20px;
}

.card{
    background:rgba(255,255,255,0.15);
    padding:15px;
    border-radius:15px;
    transition:0.3s;
}

.card:hover{
    transform:translateY(-5px);
    background:rgba(255,255,255,0.2);
}

/* History */

.history{
    margin-top:25px;
    text-align:left;
}

.history h3{
    margin-bottom:10px;
    font-size:18px;
}

.history-list{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
}

.history-item{
    padding:8px 14px;
    background:rgba(255,255,255,0.18);
    border-radius:20px;
    cursor:pointer;
    transition:0.3s;
    font-size:14px;
}

.history-item:hover{
    background:rgba(255,255,255,0.3);
}

/* Forecast Table */

.forecast-box{
    display:none;
    margin-top:30px;
    animation:slide 0.6s ease;
}

.forecast-box h3{
    margin-bottom:15px;
    font-size:20px;
    font-weight:600;
}

.forecast-table{
    width:100%;
    border-collapse:collapse;
    background:rgba(174, 21, 21, 0.1);
    border-radius:12px;
    overflow:hidden;
}

.forecast-table thead{
    background:rgba(128, 65, 65, 0.2);
}

.forecast-table th{
    padding:12px 8px;
    text-align:center;
    font-weight:600;
    font-size:14px;
}

.forecast-table td{
    padding:12px 8px;
    text-align:center;
    font-size:13px;
    border-top:1px solid rgba(255,255,255,0.1);
}

.forecast-table tbody tr:hover{
    background:rgba(255, 255, 255, 0.15);
}

.forecast-icon{
    height:35px;
    width:auto;
}

/* Month & Calendar */

.month-selector{
    display:flex;
    gap:10px;
    margin:20px 0;
    align-items:center;
}

.month-selector select{
    flex:1;
    padding:10px;
    border:none;
    border-radius:8px;
    background:rgba(255,255,255,0.2);
    color:white;
    font-size:14px;
    cursor:pointer;
}

.month-selector select option{
    background:#333;
    color:white;
}

.calendar-box{
    display:none;
    margin-top:25px;
    padding:15px;
    background:rgba(255,255,255,0.1);
    border-radius:12px;
    animation:slide 0.6s ease;
}

.calendar-box h3{
    margin-bottom:15px;
    font-size:18px;
    font-weight:600;
}

.calendar{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:5px;
    margin-bottom:15px;
}

.calendar-day{
    aspect-ratio:1;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:8px;
    background:rgba(255,255,255,0.1);
    cursor:pointer;
    font-size:12px;
    transition:0.3s;
    border:2px solid transparent;
}

.calendar-day:hover{
    background:rgba(255,255,255,0.25);
}

.calendar-day.other-month{
    opacity:0.4;
}

.calendar-day.today{
    background:linear-gradient(45deg,#ff9800,#ff5722);
    font-weight:700;
    border:2px solid rgba(255,255,255,0.3);
}

.calendar-day.selected{
    background:rgba(100,200,255,0.5);
    border:2px solid rgba(100,200,255,0.8);
}

/* Extended Forecast */

.extended-forecast{
    display:none;
    margin-top:25px;
    padding:15px;
    background:rgba(255,255,255,0.08);
    border-radius:12px;
    animation:slide 0.6s ease;
}

.extended-forecast h3{
    margin-bottom:15px;
    font-size:18px;
    font-weight:600;
}

.forecast-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(120px, 1fr));
    gap:10px;
}

.forecast-card{
    background:rgba(255,255,255,0.1);
    padding:12px;
    border-radius:10px;
    text-align:center;
    font-size:12px;
    transition:0.3s;
    cursor:pointer;
    border:2px solid transparent;
}

.forecast-card:hover{
    background:rgba(255,255,255,0.2);
    transform:translateY(-3px);
}

.forecast-card.selected{
    background:rgba(100,200,255,0.4);
    border:2px solid rgba(100,200,255,0.8);
}

.forecast-card-day{
    font-weight:600;
    margin-bottom:5px;
}

.forecast-card-icon{
    height:30px;
    margin:5px 0;
}

.forecast-card-temp{
    font-weight:600;
    color:#ffeb3b;
}

<body>

<div class="container">

    <h2>🌤 Weather App</h2>

    <div class="search-box">
        <input type="text" id="city" placeholder="Enter city name">
        <button onclick="getWeather()">Search</button>
    </div>

    <!-- Month & Year Selector -->
    <div class="month-selector" id="monthSelector" style="display:none;">
        <select id="monthSelect" onchange="updateCalendar()">
            <option value="0">January</option>
            <option value="1">February</option>
            <option value="2">March</option>
            <option value="3">April</option>
            <option value="4">May</option>
            <option value="5">June</option>
            <option value="6">July</option>
            <option value="7">August</option>
            <option value="8">September</option>
            <option value="9">October</option>
            <option value="10">November</option>
            <option value="11">December</option>
        </select>
    </div>

    <!-- Calendar -->
    <div class="calendar-box" id="calendarBox">
        <h3>📆 Select Date</h3>
        <div class="calendar" id="calendar"></div>
    </div>

    <!-- Extended Forecast -->
    <div class="extended-forecast" id="extendedForecast">
        <h3>📊 16-Day Extended Forecast</h3>
        <div class="forecast-grid" id="forecastGrid"></div>
    </div>

    <p id="loading">Loading weather...</p>

    <div class="weather-box" id="weatherBox">

        <h1 id="cityName"></h1>

        <img id="icon" class="weather-image" src="">

        <div class="temp" id="temp"></div>

        <div class="desc" id="desc"></div>

        <div class="details">

            <div class="card">
                <h4>💧 Humidity</h4>
                <p id="humidity"></p>
            </div>

            <div class="card">
                <h4>🌬 Wind</h4>
                <p id="wind"></p>
            </div>

            <div class="card">
                <h4>🌡 Feels Like</h4>
                <p id="feels"></p>
            </div>

            <div class="card">
                <h4>📍 Country</h4>
                <p id="country"></p>
            </div>

        </div>

    </div>

    <!-- Forecast Table -->
    <div class="forecast-box" id="forecastBox">
        <h3>📅 7-Day Forecast</h3>
        <table class="forecast-table">
            <thead>
                <tr>
                    <th>Day</th>
                    <th>Weather</th>
                    <th>Temp (°C)</th>
                    <th>Humidity</th>
                    <th>Wind (km/h)</th>
                </tr>
            </thead>
            <tbody id="forecastBody">
            </tbody>
        </table>
    </div>

    <!-- Search History -->

    <div class="history">
        <h3>Recent Searches</h3>
        <div class="history-list" id="historyList"></div>
    </div>

</div>

<script>

const apiKey = "e1efc59e72095b54b3f4738b2da87f60";

const cityInput = document.getElementById("city");

cityInput.addEventListener("keypress", function(e){
    if(e.key === "Enter"){
        getWeather();
    }
});

async function getWeather(cityNameFromHistory){

    const city = cityNameFromHistory || cityInput.value;

    if(city === ""){
        alert("Please enter city name");
        return;
    }

    document.getElementById("loading").style.display = "block";

    const url = `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${apiKey}&units=metric`;

    try{

        const response = await fetch(url);
        const data = await response.json();

        document.getElementById("loading").style.display = "none";

        if(data.cod == "404"){
            alert("City not found");
            return;
        }

        // Show Weather Box
        document.getElementById("weatherBox").style.display = "block";

        // Show Forecast Box
        document.getElementById("forecastBox").style.display = "block";

        // Show Month Selector & Calendar
        document.getElementById("monthSelector").style.display = "flex";
        document.getElementById("calendarBox").style.display = "block";
        document.getElementById("extendedForecast").style.display = "block";

        // Set current month
        const today = new Date();
        document.getElementById("monthSelect").value = today.getMonth();

        // Set Data
        document.getElementById("cityName").innerText = data.name;
        document.getElementById("temp").innerText = `${Math.round(data.main.temp)}°C`;
        document.getElementById("desc").innerText = data.weather[0].description;

        document.getElementById("humidity").innerText = data.main.humidity + "%";

        document.getElementById("wind").innerText = data.wind.speed + " km/h";

        document.getElementById("feels").innerText = Math.round(data.main.feels_like) + "°C";

        document.getElementById("country").innerText = data.sys.country;

        // Icon

        const iconCode = data.weather[0].icon;

        document.getElementById("icon").src =
        `https://openweathermap.org/img/wn/${iconCode}@4x.png`;

        // Background Change

        const weather = data.weather[0].main.toLowerCase();

        if(weather.includes("cloud")){
            document.body.style.backgroundImage =
            "url('https://images.unsplash.com/photo-1534088568595-a066f410bcda?q=80&w=1400&auto=format&fit=crop')";
        }

        else if(weather.includes("rain")){
            document.body.style.backgroundImage =
            "url('https://images.unsplash.com/photo-1515694346937-94d85e41e6f0?q=80&w=1400&auto=format&fit=crop')";
        }

        else if(weather.includes("clear")){
            document.body.style.backgroundImage =
            "url('https://images.unsplash.com/photo-1502082553048-f009c37129b9?q=80&w=1400&auto=format&fit=crop')";
        }

        else if(weather.includes("snow")){
            document.body.style.backgroundImage =
            "url('https://images.unsplash.com/photo-1483664852095-d6cc6870702d?q=80&w=1400&auto=format&fit=crop')";
        }

        else{
            document.body.style.backgroundImage =
            "url('https://images.unsplash.com/photo-1499346030926-9a72daac6c63?q=80&w=1400&auto=format&fit=crop')";
        }

        // Save Search History

        saveHistory(data.name);

        // Fetch Forecast

        getWeatherForecast(city);

    }
    catch(error){

        document.getElementById("loading").style.display = "none";

        alert("Error fetching weather data");

    }

}

// Update Calendar

function updateCalendar(){

    const monthSelect = document.getElementById("monthSelect").value;
    const selectedMonth = parseInt(monthSelect);
    const today = new Date();
    const year = today.getFullYear();

    const firstDay = new Date(year, selectedMonth, 1).getDay();
    const daysInMonth = new Date(year, selectedMonth + 1, 0).getDate();
    const daysInPrevMonth = new Date(year, selectedMonth, 0).getDate();

    const calendar = document.getElementById("calendar");
    calendar.innerHTML = "";

    // Add day headers
    const dayHeaders = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
    dayHeaders.forEach(day => {
        const header = document.createElement("div");
        header.className = "calendar-day";
        header.innerText = day;
        header.style.fontWeight = "700";
        header.style.cursor = "default";
        calendar.appendChild(header);
    });

    // Previous month days
    for(let i = daysInPrevMonth - firstDay + 1; i <= daysInPrevMonth; i++){
        const day = document.createElement("div");
        day.className = "calendar-day other-month";
        day.innerText = i;
        calendar.appendChild(day);
    }

    // Current month days
    for(let i = 1; i <= daysInMonth; i++){
        const day = document.createElement("div");
        day.className = "calendar-day";
        day.innerText = i;

        if(today.getMonth() === selectedMonth && today.getDate() === i){
            day.classList.add("today");
        }

        day.onclick = () => selectDate(i, selectedMonth, year);
        calendar.appendChild(day);
    }

    // Next month days
    for(let i = 1; i <= (42 - daysInMonth - firstDay); i++){
        const day = document.createElement("div");
        day.className = "calendar-day other-month";
        day.innerText = i;
        calendar.appendChild(day);
    }

}

// Select Date

function selectDate(day, month, year){
    const date = new Date(year, month, day);
    console.log("Selected date:", date.toLocaleDateString());
    
    // Mark selected date
    document.querySelectorAll(".calendar-day").forEach(d => d.classList.remove("selected"));
    event.target.classList.add("selected");
}

// Get Extended Weather Forecast

let allForecasts = [];

function getWeatherForecast(city){

    const url = `https://api.openweathermap.org/data/2.5/forecast?q=${city}&appid=${apiKey}&units=metric`;

    fetch(url)
    .then(response => response.json())
    .then(data => {

        const forecastBody = document.getElementById("forecastBody");
        forecastBody.innerHTML = "";

        // Get forecast for next 5 days (one per day at midday)
        const dailyForecasts = {};

        data.list.forEach(item => {
            const date = new Date(item.dt * 1000);
            const dayName = date.toLocaleDateString('en-US', { weekday: 'long' });
            const dateStr = date.toLocaleDateString('en-US');

            // Take forecast at around 12:00 PM each day
            if(!dailyForecasts[dateStr] || date.getHours() === 12){
                dailyForecasts[dateStr] = {
                    day: dayName,
                    date: dateStr,
                    temp: Math.round(item.main.temp),
                    tempMin: Math.round(item.main.temp_min),
                    tempMax: Math.round(item.main.temp_max),
                    humidity: item.main.humidity,
                    wind: item.wind.speed,
                    description: item.weather[0].description,
                    icon: item.weather[0].icon
                };
            }
        });

        allForecasts = Object.values(dailyForecasts);

        // Display 7-day forecasts
        allForecasts.slice(0, 7).forEach(forecast => {
            const row = document.createElement("tr");
            row.innerHTML = `
                <td><strong>${forecast.day}</strong></td>
                <td style="text-transform:capitalize;">${forecast.description}</td>
                <td><strong>${forecast.temp}°</strong></td>
                <td>${forecast.humidity}%</td>
                <td>${forecast.wind.toFixed(1)}</td>
            `;
            forecastBody.appendChild(row);
        });

        // Display 16-day extended forecast
        displayExtendedForecast();

    })
    .catch(error => {
        console.log("Error fetching forecast:", error);
    });

}

// Display Extended Forecast

function displayExtendedForecast(){

    const forecastGrid = document.getElementById("forecastGrid");
    forecastGrid.innerHTML = "";

    allForecasts.slice(0, 16).forEach((forecast, index) => {
        const card = document.createElement("div");
        card.className = "forecast-card";
        
        const date = new Date(forecast.date);
        const dayNum = date.getDate();
        
        card.innerHTML = `
            <div class="forecast-card-day">${forecast.day}</div>
            <div style="font-size:11px; color:#aaa;">${dayNum}/${date.getMonth() + 1}</div>
            <img src="https://openweathermap.org/img/wn/${forecast.icon}.png" class="forecast-card-icon" alt="${forecast.description}">
            <div class="forecast-card-temp">${forecast.tempMin}° - ${forecast.tempMax}°</div>
            <div style="text-transform:capitalize; font-size:11px; color:#ddd;">${forecast.description}</div>
        `;

        card.onclick = () => {
            document.querySelectorAll(".forecast-card").forEach(c => c.classList.remove("selected"));
            card.classList.add("selected");
        };

        forecastGrid.appendChild(card);
    });

}

// Save Search History

function saveHistory(city){

    let history = JSON.parse(localStorage.getItem("weatherHistory")) || [];

    // Prevent duplicates
    if(!history.includes(city)){
        history.unshift(city);
    }

    // Limit
    history = history.slice(0,6);

    localStorage.setItem("weatherHistory", JSON.stringify(history));

    showHistory();

}

// Show History

function showHistory(){

    const history = JSON.parse(localStorage.getItem("weatherHistory")) || [];

    const historyList = document.getElementById("historyList");

    historyList.innerHTML = "";

    history.forEach(city => {

        const div = document.createElement("div");

        div.classList.add("history-item");

        div.innerText = city;

        div.onclick = () => getWeather(city);

        historyList.appendChild(div);

    });

}

// Load History on Start

showHistory();

// Initialize Calendar
updateCalendar();

</script>
