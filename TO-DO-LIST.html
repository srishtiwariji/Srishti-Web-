<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
  <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .todo-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 500px;
            padding: 40px;
            overflow: hidden;
        }

        .todo-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .todo-header h1 {
            color: #333;
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .todo-input-container {
            display: flex;
            gap: 12px;
            margin-bottom: 30px;
        }

        .todo-input {
            flex: 1;
            padding: 16px 20px;
            border: 2px solid #e1e5e9;
            border-radius: 16px;
            font-size: 16px;
            transition: all 0.3s ease;
            outline: none;
        }

        .todo-input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .add-btn {
            padding: 16px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .add-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .filter-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            justify-content: center;
        }

        .filter-btn {
            padding: 10px 20px;
            border: 2px solid #e1e5e9;
            background: white;
            color: #666;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .filter-btn.active,
        .filter-btn:hover {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: #667eea;
            transform: translateY(-1px);
        }

        .todo-list {
            list-style: none;
            max-height: 400px;
            overflow-y: auto;
        }

        .todo-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 20px;
            margin-bottom: 12px;
            background: #f8f9fa;
            border-radius: 16px;
            border-left: 4px solid transparent;
            transition: all 0.3s ease;
            opacity: 1;
        }

        .todo-item:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .todo-checkbox {
            width: 20px;
            height: 20px;
            border: 2px solid #ddd;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .todo-checkbox.checked {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-color: #667eea;
        }

        .todo-checkbox.checked::after {
            content: '✓';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 12px;
            font-weight: bold;
        }

        .todo-text {
            flex: 1;
            font-size: 16px;
            color: #333;
            transition: all 0.3s ease;
        }

        .todo-text.completed {
            text-decoration: line-through;
            color: #999;
            font-style: italic;
        }

        .delete-btn {
            width: 32px;
            height: 32px;
            border: none;
            background: #ff6b6b;
            color: white;
            border-radius: 50%;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            opacity: 0;
        }

        .todo-item:hover .delete-btn {
            opacity: 1;
            transform: scale(1);
        }

        .delete-btn:hover {
            background: #ff5252;
            transform: scale(1.1);
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #888;
        }

        .empty-state svg {
            width: 60px;
            height: 60px;
            margin-bottom: 15px;
            opacity: 0.5;
        }

   
        .todo-list::-webkit-scrollbar {
            width: 6px;
        }

        .todo-list::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        .todo-list::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 10px;
        }

       
        .filter-all.active ~ .todo-list .todo-item.pending,
        .filter-completed.active ~ .todo-list .todo-item.pending,
        .filter-pending.active ~ .todo-list .todo-item.completed {
            display: none;
        }

        @media (max-width: 480px) {
            .todo-container {
                padding: 30px 20px;
                margin: 10px;
            }

            .todo-header h1 {
                font-size: 1.8rem;
            }

            .todo-input-container {
                flex-direction: column;
            }

            .filter-buttons {
                flex-wrap: wrap;
            }
        }



  </style>
 
</head>
<body>
    <div class="todo-container">
        <div class="todo-header">
            <h1>Todo List</h1>
          
        </div>

        <div class="todo-input-container">
            <input 
                type="text" 
                class="todo-input" 
                placeholder="Add a new task..."
                id="taskInput"
            >
            <button class="add-btn" >Add Task</button>
        </div>

        <div class="filter-buttons">
            <button class="filter-btn active" >All</button>
            <button class="filter-btn" >Pending</button>
            <button class="filter-btn" >Completed</button>
        </div>

        <ul class="todo-list" id="todoList">
         
            <li class="todo-item completed" >
                <div class="todo-checkbox checked"></div>
                <span class="todo-text completed">Complete project proposal</span>
                <button class="delete-btn" >×</button>
            </li>
            <li class="todo-item pending" >
                <div class="todo-checkbox"></div>
                <span class="todo-text">Review code changes</span>
                <button class="delete-btn" >×</button>
            </li>
            <li class="todo-item pending" >
                <div class="todo-checkbox"></div>
                <span class="todo-text">Schedule team meeting</span>
                <button class="delete-btn" >×</button>
            </li>
        </ul>
    </div>


</body>
</html>
